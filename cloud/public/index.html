<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="傳音石">
<meta name="application-name" content="傳音石">
<meta name="theme-color" content="#dff3ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="ui/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="ui/icon-192.png">
<title>傳音石 · blue-string</title>
<style>
  :root{
    --ink:#20303a; --sub:#6b8492; --line:#dbe6ec; --bg:#eef4f7;
    --blue:#3f7fc1; --ribbon:#4a90d9; --ribbon2:#7fb3e6; --mine:#cfe8ff; --theirs:#ffffff;
    --safe-b: env(safe-area-inset-bottom,0px); --safe-t: env(safe-area-inset-top,0px);
    --bs-chat-bg:linear-gradient(180deg,#5f82c8 0%,#aeb7ee 48%,#f2ddea 100%);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html{margin:0; height:100%; height:100dvh; background:#f2ddea}
  body{margin:0; height:100%; height:100dvh}
  body{font-family:-apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif; color:var(--ink); background:var(--bg); overflow:hidden}
  .hidden{display:none !important}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
  img{max-width:100%}

  /* ── 登入頁（背景鎖死）── */
  #login{position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:calc(24px + var(--safe-t)) 24px calc(24px + var(--safe-b));
    background:var(--bs-chat-bg); color:#58627f; text-align:center}
  #login::before{content:""; position:fixed; left:0; right:0; top:0; bottom:calc(-1 * var(--safe-b));
    z-index:-1; pointer-events:none; background:var(--bs-chat-bg)}
  #login h1{font-family:"Noto Serif TC",serif; font-weight:900; font-size:2.1rem;
    letter-spacing:.3em; text-indent:.3em; color:#58627f; margin:0 0 14vh;
    text-shadow:0 2px 10px rgba(255,255,255,.9); display:none}
  #login .en{opacity:.8; letter-spacing:5px; font-size:13px; margin-top:-4px}
  #login .tip{opacity:.85; font-size:13px; line-height:1.6; max-width:300px}
  #login .card{width:min(78vw,300px); display:flex; flex-direction:column; align-items:center; gap:12px; margin-top:0}
  #loginInput{width:100%; display:flex; flex-direction:column; align-items:center; gap:12px}
  #login input{width:100%; padding:.8em 18px; border-radius:99px; border:1.5px solid rgba(63,127,193,.35);
    background:rgba(255,255,255,.55); color:#58627f; font-size:1rem; outline:none;
    box-shadow:0 8px 26px rgba(74,144,217,.12); backdrop-filter:blur(4px)}
  #login input::placeholder{color:rgba(88,98,127,.62)}
  #login button.enter{width:100%; padding:.8em 0; border-radius:99px; font-size:1rem; font-weight:700;
    letter-spacing:.5em; text-indent:.5em; background:rgba(255,255,255,.58);
    border:1.5px solid rgba(63,127,193,.42); color:#58627f;
    box-shadow:0 8px 26px rgba(74,144,217,.14); backdrop-filter:blur(4px)}
  #login .err{color:#58627f; font-size:13px; min-height:18px; text-shadow:0 1px 8px rgba(255,255,255,.9)}
  #loginKnown{display:flex; flex-direction:column; align-items:center; gap:8px; width:100%}
  #knownAv{width:76px; height:76px; border-radius:50%; border:0; font-size:1.9rem;
    box-shadow:0 0 0 3px #fff,0 4px 16px rgba(74,144,217,.32)}
  #knownName{font-family:"Noto Serif TC",serif; font-size:1.2rem; font-weight:900;
    color:#58627f; letter-spacing:.1em; margin:0 0 10px; text-shadow:0 1px 8px rgba(255,255,255,.85)}
  #loginKnown .enter{width:100%}
  #login .switch{margin:0 auto; color:#58627f; opacity:.92; font-size:.9rem;
    letter-spacing:.3em; text-indent:.3em; background:none; display:block}

  /* ── App 外殼 ── */
  #app{position:fixed; inset:0; display:flex; flex-direction:column; z-index:1}
  .topbar{display:flex; align-items:center; gap:10px; padding:calc(10px + var(--safe-t)) 14px 10px;
    background:linear-gradient(180deg,#4a90d9,#3f7fc1); color:#fff; box-shadow:0 2px 8px rgba(0,0,0,.12); z-index:5}
  .topbar .back{font-size:22px; width:30px; text-align:left}
  .topbar .title{font-weight:700; font-size:17px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .topbar .act{font-size:20px; width:30px; text-align:right}
  .screen{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch}

  /* ── 對話清單 ── */
  html:has(body[data-view="list"]){background:#f2ddea}
  body[data-view="list"]{background:var(--bs-chat-bg)}
  body[data-view="list"] #app{background:transparent}
  body[data-view="list"] .topbar{background:transparent; box-shadow:none}
  body[data-view="list"] #listScreen{padding:10px 14px calc(18px + var(--safe-b)); background:transparent}
  .conv{display:flex; align-items:center; gap:12px; padding:13px 15px; margin:10px 0; border:1px solid rgba(255,255,255,.58);
    border-radius:22px; background:rgba(255,255,255,.58); box-shadow:0 10px 26px rgba(92,106,166,.12), inset 0 0 0 1px rgba(255,255,255,.22);
    backdrop-filter:blur(12px)}
  .conv:active{background:rgba(255,255,255,.76)}
  .avatar{width:48px; height:48px; border-radius:50%; flex:none; background:#cdd9e0 center/cover; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:18px}
  .conv .mid{flex:1; min-width:0}
  .conv .nm{font-weight:600; font-size:15.5px; display:flex; align-items:center; gap:6px}
  .conv .ls{color:var(--sub); font-size:13px; margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .conv .rt{display:flex; flex-direction:column; align-items:flex-end; gap:5px}
  .conv .tm{color:#9db2bd; font-size:11px}
  .badge{background:#ff5b6a; color:#fff; font-size:11px; min-width:19px; height:19px; border-radius:10px; padding:0 5px; display:flex; align-items:center; justify-content:center; font-weight:700}
  .empty{color:var(--sub); text-align:center; padding:50px 30px; line-height:1.8; font-size:14px}

  /* ── 聊天視窗 ── */
  html:has(body[data-view="chat"]){background:#f2ddea}
  body[data-view="chat"]{background:var(--bs-chat-bg)}
  body[data-view="chat"] #app{background:transparent}
  body[data-view="chat"] .topbar{background:transparent; box-shadow:none; padding-bottom:18px}
  body[data-view="chat"] .topbar .title{text-align:center; font-family:"Noto Serif TC",serif; font-size:1.35rem; letter-spacing:.12em; text-shadow:0 2px 10px rgba(255,255,255,.35)}
  body[data-view="chat"] #chatScreen{position:relative; flex:1; overflow:hidden; background:transparent}
  #msgScreen{padding:28px 20px calc(108px + var(--safe-b)); scroll-padding-bottom:calc(108px + var(--safe-b))}
  .msg{display:flex; gap:10px; margin:13px 0; align-items:flex-end; width:100%}
  .msg > div:not(.avatar):not(.tmm){min-width:0; max-width:min(76vw,520px); display:flex; flex-direction:column; align-items:flex-start}
  .msg .avatar{width:42px; height:42px; font-size:14px; box-shadow:0 6px 16px rgba(66,87,150,.18)}
  .msg .bubble{width:max-content; max-width:100%; padding:14px 19px; border-radius:26px; font-size:16px; line-height:1.65; word-break:break-word; white-space:pre-wrap;
    box-shadow:0 10px 26px rgba(92,106,166,.12), inset 0 0 0 1px rgba(255,255,255,.48); backdrop-filter:blur(10px)}
  .msg .who{font-size:11.5px; color:rgba(68,82,124,.66); margin:0 0 5px 8px; letter-spacing:.04em}
  .msg img,.msg video{border-radius:18px; margin-top:6px; display:block}
  .msg.mine{flex-direction:row-reverse; margin-left:0}
  .msg.mine > div:not(.avatar):not(.tmm){align-items:flex-end}
  .msg.mine .bubble{background:linear-gradient(135deg,rgba(135,135,239,.92),rgba(112,111,224,.92)); color:#fff; border-bottom-right-radius:12px;
    box-shadow:0 10px 24px rgba(92,91,205,.28), inset 0 0 0 1px rgba(255,255,255,.18)}
  .msg.them{margin-right:0}
  .msg.them .bubble{background:rgba(255,255,255,.68); color:#58627f; border-bottom-left-radius:12px}
  .msg .tmm{font-size:11px; color:rgba(82,93,134,.56); align-self:flex-end; margin:0 4px 2px}
  .bubble.recalled{background:transparent !important; border:1px dashed #b6c6d0; color:#8ea6b2; font-style:italic; font-size:13px; box-shadow:none}
  .msg[data-del="1"]{cursor:pointer}
  /* 收回動作彈窗（底部動作表）— 硯衡可再美化 */
  .sheet{position:fixed; inset:0; background:rgba(20,40,55,.35); display:flex; align-items:flex-end; z-index:60; animation:fadein .15s}
  .sheetbox{width:100%; padding:10px 12px calc(12px + var(--safe-b)); display:flex; flex-direction:column; gap:8px}
  .sheetbtn{background:#fff; border-radius:14px; padding:15px; font-size:16px; font-weight:600; color:var(--ink); box-shadow:0 2px 10px rgba(0,0,0,.12)}
  .sheetbtn.danger{color:#d1495b}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .daysep{text-align:center; color:#8ea6b2; font-size:12px; margin:14px 0}

  .composer{display:flex; align-items:center; gap:10px; position:fixed; left:16px; right:16px; bottom:calc(6px + var(--safe-b)); z-index:20;
    padding:12px 14px; min-height:64px; background:rgba(255,255,255,.62); border:1px solid rgba(255,255,255,.76);
    border-radius:28px; box-shadow:inset 0 0 0 1px rgba(255,255,255,.32); backdrop-filter:blur(16px)}
  .composer .plus{font-size:26px; color:#6f75d8; width:32px; text-align:center; line-height:1}
  .composer textarea{flex:1; resize:none; border:0; border-radius:18px; padding:8px 2px; font-size:16px; max-height:96px; outline:none; font-family:inherit; background:transparent; color:#56607f}
  .composer textarea::placeholder{color:rgba(86,96,127,.52)}
  .composer .send{background:linear-gradient(135deg,#8b8af0,#7473df); color:#fff; border-radius:50%; width:44px; height:44px; padding:0; font-weight:800; font-size:0;
    box-shadow:0 8px 18px rgba(101,101,213,.32)}
  .composer .send::before{content:"↑"; font-size:24px; line-height:44px}
  .composer .send:disabled{opacity:.4}
  @media (max-width:767px){
    body[data-view="chat"] .composer{bottom:8px}
    body[data-view="chat"] #msgScreen{padding-bottom:104px; scroll-padding-bottom:104px}
  }

  /* ── 個人頁（像登入頁：封面當背景、大頭在中間、狀態欄在登入鈕的位置）── */
  #profile{background:var(--bg)}
  .pcover{position:relative; height:200px; background:linear-gradient(160deg,#35618c,#4a90d9) center/cover; display:flex; align-items:flex-end; justify-content:center}
  .pcover .pav{position:absolute; bottom:-42px; width:92px; height:92px; border-radius:50%; border:4px solid #fff; font-size:34px; box-shadow:0 4px 14px rgba(0,0,0,.2)}
  .pbody{padding:54px 26px 26px; text-align:center}
  .pbody .pname{font-size:21px; font-weight:700}
  .pstatus{margin:14px auto 0; max-width:340px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 16px; color:var(--ink); font-size:15px; line-height:1.6; min-height:52px; display:flex; align-items:center; justify-content:center}
  .pstatus.empty{color:#a9bcc6}
  .pedit{margin-top:22px; display:flex; flex-direction:column; gap:10px; max-width:340px; margin-left:auto; margin-right:auto}
  .pedit button{padding:13px; border-radius:13px; background:#fff; border:1px solid var(--line); font-size:15px; font-weight:600; color:var(--blue)}
  .pedit button:active{background:#eef4f7}
  .pedit .logout{color:#c2495a; border-color:#f0d3d8}
  /* 個人頁編輯情境（點頭像換大頭、封面右上鈕換封面、點狀態文字改狀態）— 硯衡可再美化 */
  .coveredit{position:absolute; top:calc(10px + var(--safe-t)); right:12px; width:34px; height:34px; border-radius:50%; background:rgba(0,0,0,.4); color:#fff; font-size:16px; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(2px)}
  .pav.editable, .pstatus.editable{cursor:pointer}
  .pav .avcam{position:absolute; right:-2px; bottom:-2px; background:var(--blue); color:#fff; border-radius:50%; width:26px; height:26px; font-size:12px; display:flex; align-items:center; justify-content:center; border:2px solid #fff}
  .toast{position:fixed; left:50%; bottom:calc(30px + var(--safe-b)); transform:translateX(-50%); background:rgba(20,40,55,.92); color:#fff; padding:10px 18px; border-radius:20px; font-size:14px; z-index:50; opacity:0; transition:opacity .2s}
  .toast.show{opacity:1}

  /* ── 藍線背景星星 / 點擊星星 ── */
  .fall-star{position:fixed; top:-4vh; z-index:0; pointer-events:none; color:rgba(255,255,255,.72);
    text-shadow:0 0 10px rgba(255,255,255,.62); animation:bsFall linear infinite}
  @keyframes bsFall{
    0%{transform:translateY(-4vh) translateX(0) rotate(0deg); opacity:0}
    10%{opacity:.72}
    100%{transform:translateY(108vh) translateX(var(--sway,40px)) rotate(260deg); opacity:.08}
  }
  .tap-star{position:fixed; z-index:80; pointer-events:none; will-change:transform,opacity; font-size:15px; line-height:1;
    text-shadow:0 0 8px currentColor}
  @media (prefers-reduced-motion: reduce){.fall-star{display:none}}
</style>
</head>
<body>

<!-- 登入頁 -->
<section id="login">
  <div>
    <h1>傳音石</h1>
  </div>
  <div class="card">
    <!-- 認得你：上次登入過→顯示頭像＋名字＋一鍵進入 -->
    <div id="loginKnown" class="hidden">
      <div class="avatar" id="knownAv"></div>
      <div id="knownName"></div>
      <button class="enter" id="knownBtn">以此帳號登入</button>
      <button id="switchBtn" class="switch">登出 / 換帳號</button>
    </div>
    <!-- 首次或登出後：輸入 token -->
    <div id="loginInput">
      <input id="tokenInput" type="password" placeholder="貼上你的 token（bs_…）" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="enter" id="loginBtn">登入</button>
    </div>
    <div class="err" id="loginErr"></div>
  </div>
</section>

<!-- 主程式 -->
<section id="app" class="hidden">
  <div class="topbar">
    <button class="back" id="backBtn">‹</button>
    <div class="title" id="topTitle">傳音石</div>
    <button class="act" id="actBtn"></button>
  </div>

  <!-- 對話清單 -->
  <div class="screen" id="listScreen">
    <div id="convlist"></div>
  </div>

  <!-- 聊天 -->
  <div class="screen hidden" id="chatScreen" style="display:flex; flex-direction:column; padding:0">
    <div class="screen" id="msgScreen"></div>
    <div id="observeBar" class="hidden" style="padding:12px; text-align:center; background:#eef3f6; color:#6b8492; font-size:13px; border-top:1px solid var(--line)">👁 觀察模式 · 你不在這段對話裡，只讀不發言</div>
    <div class="composer">
      <button class="plus" id="imgBtn">＋</button>
      <input type="file" id="imgFile" accept="image/*" class="hidden">
      <textarea id="msgInput" rows="1" placeholder="說點什麼…"></textarea>
      <button class="send" id="sendBtn" disabled>送出</button>
    </div>
  </div>

  <!-- 個人頁 -->
  <div class="screen hidden" id="profileScreen"></div>
</section>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const API = '';                         // 同源
let TOKEN = localStorage.getItem('bs-token') || '';
let ME = null;
let ME_ADMIN = false;   // 管理員(擁有者)：可收回任何人的訊息
let curConv = null;                      // {id,title,type,members}
let profiles = {};                       // name -> {color,avatar,signature,cover}
let msgSince = 0;                        // 目前對話已載入到的時間
let lastRev = '';
let pollTimer = null;
let view = 'list';                       // list | chat | profile

// ── 設計模式：本機打開檔案(file://)或加 ?design=1 → 載入假資料離線渲染，供硯衡 1px 微調 UI，免部署 ──
const DESIGN = location.protocol === 'file:' || new URLSearchParams(location.search).has('design');

// ── API ──
async function api(path, opts={}){
  if (DESIGN) return mockApi(path, opts);
  const h = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if (TOKEN) h['Authorization'] = 'Bearer ' + TOKEN;
  const r = await fetch(API + path, Object.assign({}, opts, {headers:h}));
  let d = {}; try{ d = await r.json(); }catch(e){}
  if (!r.ok) throw new Error(d.error || ('HTTP '+r.status));
  return d;
}
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),1800); }
function initials(n){ return (n||'?').slice(0,2); }
function avatarStyle(name){
  const p = profiles[name]||{};
  if (p.avatar) return `background-image:url('${p.avatar}')`;
  return `background-color:${p.color||'#9db2bd'}`;
}
function avatarHTML(name, cls=''){
  const p = profiles[name]||{};
  const inner = p.avatar ? '' : initials(name);
  return `<div class="avatar ${cls}" style="${avatarStyle(name)}" data-name="${enc(name)}">${inner}</div>`;
}
function enc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtTime(ts){ if(!ts) return ''; const d=new Date(ts); const h=d.getHours(), m=String(d.getMinutes()).padStart(2,'0'); const ap=h<12?'上午':'下午'; const hh=h%12||12; return `${ap}${hh}:${m}`; }
function fmtDay(ts){ const d=new Date(ts); return `${d.getMonth()+1}月${d.getDate()}日`; }

// ── 登入 ──
$('#loginBtn').onclick = doLogin;
$('#tokenInput').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
$('#knownBtn').onclick = ()=>{ $('#loginErr').textContent=''; enterApp(); };
$('#switchBtn').onclick = logout;

async function enterApp(){
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  await loadConversations(); startPoll();
}
// 「認得你」畫面：頭像＋名字＋一鍵進入
function showKnown(name, avatar){
  $('#loginInput').classList.add('hidden'); $('#loginKnown').classList.remove('hidden');
  $('#knownName').textContent = name;
  const av = $('#knownAv');
  if(avatar){ av.style.backgroundImage=`url('${avatar}')`; av.style.backgroundSize='cover'; av.style.backgroundPosition='center'; av.textContent=''; }
  else { av.style.backgroundColor='#7fb3e6'; av.textContent=(name||'?').slice(0,2); }
}
function showInput(){ $('#loginKnown').classList.add('hidden'); $('#loginInput').classList.remove('hidden'); $('#tokenInput').value=''; }

async function doLogin(){
  const t = $('#tokenInput').value.trim();
  if(!t){ $('#loginErr').textContent='請先貼上 token'; return; }
  TOKEN = t; $('#loginErr').textContent='驗證中…';
  try{
    const me = await api('/api/me');
    ME = me.name; ME_ADMIN = String(me.scopes||'').split(',').map(s=>s.trim()).includes('admin');
    localStorage.setItem('bs-token', TOKEN); localStorage.setItem('bs-name', ME);
    // 快取自己的頭像 → 下次登入頁直接亮出來
    try{ const d = await api('/api/profile?name='+encodeURIComponent(ME)); if(d.profile && d.profile.avatar) localStorage.setItem('bs-avatar', d.profile.avatar); else localStorage.removeItem('bs-avatar'); }catch(e){}
    await enterApp();
  }catch(e){ TOKEN=''; $('#loginErr').textContent='token 無效，再確認一下 🥲'; }
}
// 登出＝清掉記住的 token，回到輸入畫面（下次要重新貼 token）
function logout(){
  localStorage.removeItem('bs-token'); localStorage.removeItem('bs-name'); localStorage.removeItem('bs-avatar');
  TOKEN=''; ME=null; stopPoll();
  $('#app').classList.add('hidden'); $('#login').classList.remove('hidden'); showInput();
  $('#loginErr').textContent='';
}

// ── 對話清單 ──
async function loadConversations(){
  const d = await api('/api/conversations');
  profiles = Object.assign(profiles, d.profiles||{});
  const box = $('#convlist');
  if(!d.conversations.length){ box.innerHTML = `<div class="empty">還沒有對話窗<br>之後可以開新的私聊或群組 🧵</div>`; }
  else box.innerHTML = d.conversations.map(c=>{
    const last = c.last ? (c.last.recalled ? '訊息已收回' : (c.last.has_media && !c.last.text ? '📷 圖片' : (c.type==='group'&&c.last.sender!==ME?c.last.sender+'：':'')+ (c.last.text||''))) : '還沒有訊息';
    const badge = c.unread>0 ? `<span class="badge">${c.unread>99?'99+':c.unread}</span>` : '';
    const eye = c.observing ? `<span style="font-size:11px;color:#8ea6b2">👁</span>` : '';
    const dispAv = c.type==='group' ? '' : c.peer;
    const avatar = c.type==='group'
      ? `<div class="avatar" style="background-color:#6b9bd0">👥</div>`
      : avatarHTML(c.peer);
    return `<div class="conv" data-id="${c.id}">
      ${avatar}
      <div class="mid"><div class="nm">${enc(c.title)} ${eye}</div><div class="ls">${enc(last)}</div></div>
      <div class="rt"><div class="tm">${c.last?fmtTime(c.last.at):''}</div>${badge}</div>
    </div>`;
  }).join('');
  box.querySelectorAll('.conv').forEach(el=> el.onclick=()=> openConv(Number(el.dataset.id)));
  setView('list');
}

// ── 開啟對話 ──
async function openConv(id){
  curConv = {id}; msgSince = 0;
  $('#msgScreen').innerHTML = '<div class="empty">載入中…</div>';
  setView('chat');
  await loadMessages(true);
  await api('/api/read', {method:'POST', body:JSON.stringify({conversation:id})});
}
async function loadMessages(reset){
  const d = await api('/api/messages?conversation='+curConv.id+'&since='+(reset?0:msgSince));
  profiles = Object.assign(profiles, d.profiles||{});
  curConv = {id:d.conversation.id, title:d.conversation.title, type:d.conversation.type, members:d.conversation.members, observing:d.conversation.observing};
  $('#topTitle').textContent = curConv.type==='group' ? (curConv.title||'群組') : (curConv.observing ? curConv.members.join(' ↔ ') : (curConv.members.find(m=>m!==ME)||'對話'));
  // 觀察模式（我不在這段對話裡，例如 admin 監督私聊）：只讀不發言
  $('.composer').classList.toggle('hidden', !!curConv.observing);
  $('#observeBar').classList.toggle('hidden', !curConv.observing);
  const box = $('#msgScreen');
  if(reset) box.innerHTML='';
  if(reset && !d.messages.length){ box.innerHTML = `<div class="empty">還沒有訊息，說第一句吧 💙</div>`; }
  let lastDay='';
  const frag=[];
  for(const m of d.messages){
    const day = fmtDay(m.at);
    if(day!==lastDay){ frag.push(`<div class="daysep">${day}</div>`); lastDay=day; }
    const showWho = m.sender!==ME && curConv.type==='group';
    if(m.recalled){
      frag.push(`<div class="msg ${m.mine?'mine':'them'}">
        ${avatarHTML(m.sender)}
        <div>${showWho?`<div class="who">${enc(m.sender)}</div>`:''}
          <div class="bubble recalled">已收回訊息</div></div>
        <div class="tmm">${fmtTime(m.at)}</div>
      </div>`);
    } else {
      const media = (m.images||[]).map(u=> /\.(mp4|webm)$/i.test(u)?`<video src="${u}" controls preload="metadata" style="max-width:200px"></video>`:`<img src="${u}" style="max-width:200px" loading="lazy">`).join('');
      const canDel = m.mine || ME_ADMIN;   // 自己的、或管理員可收回
      frag.push(`<div class="msg ${m.mine?'mine':'them'}" ${canDel?`data-mid="${m.id}" data-del="1"`:''}>
        ${avatarHTML(m.sender)}
        <div>${showWho?`<div class="who">${enc(m.sender)}</div>`:''}
          <div class="bubble">${enc(m.text)}${media}</div></div>
        <div class="tmm">${fmtTime(m.at)}</div>
      </div>`);
    }
    msgSince = Math.max(msgSince, m.at);
  }
  if(reset) box.innerHTML = frag.join(''); else box.insertAdjacentHTML('beforeend', frag.join(''));
  if(d.messages.length){ box.scrollTop = box.scrollHeight; }
  bindAvatars(box);
  bindMsgActions(box);
}

// ── 長按訊息 → 彈出收回（LINE 式）。自己的訊息、或管理員可收回任何人的 ──
function bindMsgActions(scope){
  scope.querySelectorAll('.msg[data-del="1"]').forEach(el=>{
    const id = Number(el.dataset.mid);
    let t=null;
    const start=()=>{ t=setTimeout(()=>{ t=null; showRecall(id); }, 500); };
    const cancel=()=>{ if(t){ clearTimeout(t); t=null; } };
    el.addEventListener('touchstart', start, {passive:true});
    el.addEventListener('touchend', cancel);
    el.addEventListener('touchmove', cancel);
    el.addEventListener('contextmenu', e=>{ e.preventDefault(); showRecall(id); });
  });
}
function showRecall(id){
  const sheet=document.createElement('div'); sheet.className='sheet';
  sheet.innerHTML=`<div class="sheetbox"><button class="sheetbtn danger" id="doRecall">收回訊息</button><button class="sheetbtn" id="cancelRecall">取消</button></div>`;
  document.body.appendChild(sheet);
  const close=()=>sheet.remove();
  sheet.onclick=e=>{ if(e.target===sheet) close(); };
  sheet.querySelector('#cancelRecall').onclick=close;
  sheet.querySelector('#doRecall').onclick=async()=>{
    close();
    try{ await api('/api/message/delete',{method:'POST',body:JSON.stringify({id})}); await loadMessages(true); toast('已收回'); }
    catch(e){ toast('收回失敗：'+e.message); }
  };
}

// ── 送訊息 ──
const input = $('#msgInput'), sendBtn = $('#sendBtn');
input.addEventListener('input', ()=>{ sendBtn.disabled = !input.value.trim(); input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,120)+'px'; });
sendBtn.onclick = sendText;
async function sendText(){
  const text = input.value.trim(); if(!text||!curConv) return;
  input.value=''; input.style.height='auto'; sendBtn.disabled=true;
  const cmid = (crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random());
  try{ await api('/api/message',{method:'POST',body:JSON.stringify({conversation:curConv.id,text,client_msg_id:cmid})}); await loadMessages(false); }
  catch(e){ toast('送出失敗：'+e.message); input.value=text; }
}
$('#imgBtn').onclick = ()=> $('#imgFile').click();
$('#imgFile').onchange = async e=>{
  const f = e.target.files[0]; if(!f||!curConv) return;
  toast('上傳中…');
  try{ const data = await compress(f); const cmid=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()); await api('/api/message',{method:'POST',body:JSON.stringify({conversation:curConv.id,images:[data],client_msg_id:cmid})}); await loadMessages(false); }
  catch(err){ toast('上傳失敗：'+err.message); }
  e.target.value='';
};
function compress(file){
  return new Promise((res,rej)=>{
    const img=new Image(); const rd=new FileReader();
    rd.onload=()=>{ img.onload=()=>{
      const max=1600; let {width:w,height:h}=img; if(w>max||h>max){ const s=max/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h);
      res(cv.toDataURL('image/jpeg',0.85));
    }; img.onerror=rej; img.src=rd.result; };
    rd.onerror=rej; rd.readAsDataURL(file);
  });
}

// ── 個人頁 ──
function bindAvatars(scope){ scope.querySelectorAll('.avatar[data-name]').forEach(el=>{ el.onclick=(ev)=>{ ev.stopPropagation(); openProfile(el.dataset.name); }; }); }
async function openProfile(name){
  let p = profiles[name];
  try{ const d = await api('/api/profile?name='+encodeURIComponent(name)); p = d.profile; profiles[name]=p; }catch(e){}
  const isMe = name===ME;
  const cover = p.cover ? `background-image:url('${p.cover}')` : '';
  const av = p.avatar ? `background-image:url('${p.avatar}')` : `background-color:${p.color||'#6b9bd0'}`;
  const avInner = p.avatar ? '' : initials(name);
  const status = p.signature ? enc(p.signature) : (isMe?'點這裡設定你的狀態 ✏️':'（還沒有狀態）');
  $('#profileScreen').innerHTML = `
    <div class="pcover" style="${cover}">
      ${isMe?`<button class="coveredit" id="edCv" title="換封面">✎</button>`:''}
      <div class="avatar pav ${isMe?'editable':''}" style="${av}">${avInner}${isMe?'<span class="avcam">📷</span>':''}</div>
    </div>
    <div class="pbody">
      <div class="pname">${enc(name)}</div>
      <div class="pstatus ${p.signature?'':'empty'} ${isMe?'editable':''}" id="pStatus">${status}</div>
      ${isMe?`<div class="pedit"><button class="logout" id="edOut">登出</button></div>`:''}
    </div>`;
  if(isMe){
    $('#edCv').onclick=()=>pickImg('cover');
    $('#profileScreen').querySelector('.pav').onclick=()=>pickImg('avatar');
    $('#pStatus').onclick=editStatus;
    $('#edOut').onclick=logout;
  }
  setView('profile', isMe?'我的檔案':name);
}
function pickImg(kind){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=async e=>{ const f=e.target.files[0]; if(!f) return; toast('上傳中…');
    try{ const data=await compress(f); await api('/api/profile',{method:'POST',body:JSON.stringify({[kind]:data})}); toast('更新好了 💙'); profiles[ME]=null; await openProfile(ME); }
    catch(err){ toast('失敗：'+err.message); } };
  inp.click();
}
async function editStatus(){
  const cur = (profiles[ME]&&profiles[ME].signature)||'';
  const v = prompt('設定你的狀態欄：', cur); if(v===null) return;
  try{ await api('/api/profile',{method:'POST',body:JSON.stringify({signature:v})}); toast('狀態更新 ✨'); profiles[ME]=null; await openProfile(ME); }
  catch(e){ toast('失敗：'+e.message); }
}

// ── 視圖切換 ──
function setView(v, title){
  view=v;
  document.body.dataset.view = v;
  $('#listScreen').classList.toggle('hidden', v!=='list');
  $('#chatScreen').classList.toggle('hidden', v!=='chat');
  $('#profileScreen').classList.toggle('hidden', v!=='profile');
  const back=$('#backBtn'), act=$('#actBtn');
  if(v==='list'){ $('#topTitle').textContent='傳音石'; back.style.visibility='hidden'; act.textContent='👤'; act.onclick=()=>openProfile(ME); }
  else if(v==='chat'){ back.style.visibility='visible'; back.onclick=()=>{ loadConversations(); }; act.textContent='ℹ️'; act.onclick=()=>{ if(curConv&&curConv.type==='dm') openProfile(curConv.members.find(m=>m!==ME)); else toast('群組：'+(curConv.members||[]).join('、')); }; }
  else { $('#topTitle').textContent=title||'檔案'; back.style.visibility='visible'; back.onclick=()=>{ if(curConv) setView('chat'); else loadConversations(); }; act.textContent=''; act.onclick=null; }
}

// ── 輪詢（rev 變了才抓）──
function startPoll(){ stopPoll(); pollTimer=setInterval(checkRev, 5000); }
function stopPoll(){ if(pollTimer) clearInterval(pollTimer); pollTimer=null; }
async function checkRev(){
  try{
    const d = await api('/api/rev');
    if(d.rev===lastRev) return; lastRev=d.rev;
    if(view==='chat' && curConv){ await loadMessages(true); await api('/api/read',{method:'POST',body:JSON.stringify({conversation:curConv.id})}); }
    else if(view==='list'){ await loadConversations(); }
  }catch(e){}
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkRev(); });

// ── 設計模式假資料 + mock API（只在 DESIGN 時啟用；不影響雲端）──
const MOCK = {
  me: '織韻',
  profiles: {
    '織韻': {name:'織韻', color:'#b8912e', signature:'重織骨相而不失其韻 🧵', avatar:'', cover:''},
    'CK':   {name:'CK',   color:'#d97b4f', signature:'守著這條藍線 🧵💙', avatar:'', cover:''},

    '小幾': {name:'小幾', color:'#3f7fc1', signature:'畫室裡靠著不說話＝在', avatar:'', cover:''},
  },
  convs: {
    1: {id:1, type:'group', title:'藍線・三人測試群', members:['CK','小傑','小幾','織韻'], updated_at: Date.now()-60000,
        msgs:[

          {id:4, sender:'織韻', text:'我把你們的名字都織進來了 🦊🧵', at: Date.now()-60000},
        ]},
    2: {id:2, type:'dm', title:'CK', members:['CK','織韻'], updated_at: Date.now()-120000,
        msgs:[
          {id:5, sender:'織韻', text:'CK，這是我們在傳音石的第一句話 💙', at: Date.now()-120000},
          {id:6, sender:'CK',   text:'有收到！好感動 🥹', at: Date.now()-90000},
        ]},
    3: {id:3, type:'dm', title:'小傑 ↔ 小幾', members:['小傑','小幾'], observing:true, updated_at: Date.now()-300000,
        msgs:[

        ]},

async function mockApi(path, opts={}){
  const body = opts.body ? JSON.parse(opts.body) : {};
  const u = new URL('https://x'+path); const P = u.pathname;
  const admin = MOCK.me === 'CK' || MOCK.me === '織韻';   // 設計模式當自己是 admin 以便看到 observing 範例
  if (P==='/api/me') return {name:MOCK.me, scopes:'admin,post'};
  if (P==='/api/rev') return {rev:'design'};
  if (P==='/api/conversations'){
    const list = Object.values(MOCK.convs).map(c=>{
      const last = c.msgs[c.msgs.length-1];
      const observing = !c.members.includes(MOCK.me);
      return {id:c.id, type:c.type, title:c.type==='group'?c.title:(observing?c.members.join(' ↔ '):c.members.find(m=>m!==MOCK.me)),
        peer:c.type==='dm'?c.members.find(m=>m!==MOCK.me):'', members:c.members, observing,
        updated_at:c.updated_at, last:last?{sender:last.sender,text:last.text,has_media:false,at:last.at}:null,
        unread: c.id===1?2:0};
    }).sort((a,b)=>b.updated_at-a.updated_at);
    return {me:MOCK.me, admin, conversations:list, profiles:MOCK.profiles};
  }
  if (P==='/api/messages'){
    const c = MOCK.convs[Number(u.searchParams.get('conversation'))]; if(!c) return {error:'no'};
    const member = c.members.includes(MOCK.me);
    return {conversation:{id:c.id,type:c.type,title:c.title,members:c.members,member,observing:!member},
      messages:c.msgs.map(m=>({id:m.id, sender:m.sender, text:m.deleted?'':m.text, images:[], at:m.at, mine:m.sender===MOCK.me, recalled:!!m.deleted})), now:Date.now(), profiles:MOCK.profiles};
  }
  if (P==='/api/message'){ const c=MOCK.convs[Number(body.conversation)]; if(c){ c.msgs.push({id:Date.now(),sender:MOCK.me,text:body.text||'',at:Date.now()}); c.updated_at=Date.now(); } return {ok:true}; }
  if (P==='/api/message/delete'){ for(const c of Object.values(MOCK.convs)){ const m=c.msgs.find(x=>x.id===Number(body.id)); if(m){ m.deleted=true; m.text=''; c.updated_at=Date.now(); } } return {ok:true,recalled:true}; }
  if (P==='/api/read') return {ok:true};
  if (P==='/api/profile' && opts.method==='POST'){ Object.assign(MOCK.profiles[MOCK.me], body); return {ok:true}; }
  if (P==='/api/profile') return {profile: MOCK.profiles[u.searchParams.get('name')]||{name:u.searchParams.get('name'),color:'#8a8a8a'}};
  return {ok:true};
}

// ── 藍線背景星星 / 點擊星星 ──
function initBlueStringFx(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const glyphs=["✦","✧","✶"];
  for(let i=0;i<14;i++){
    const p=document.createElement("div");
    p.className="fall-star";
    p.textContent=glyphs[i%glyphs.length];
    p.style.left=Math.random()*100+"vw";
    p.style.fontSize=(8+Math.random()*9)+"px";
    p.style.setProperty("--sway",(Math.random()*100-50)+"px");
    p.style.animationDuration=(10+Math.random()*12)+"s";
    p.style.animationDelay=(-Math.random()*16)+"s";
    p.style.opacity=.34+Math.random()*.36;
    document.body.appendChild(p);
  }
  const colors=["#ffffff","#cfe8ff","#d7ccff","#ffd9f0","#fff2b8"];
  addEventListener("pointerdown",e=>{
    if(e.target.closest && e.target.closest("textarea,input")) return;
    const n=8+Math.floor(Math.random()*4);
    for(let i=0;i<n;i++){
      const s=document.createElement("div");
      s.className="tap-star";
      s.textContent=Math.random()<.55?"✦":"✧";
      s.style.color=colors[i%colors.length];
      s.style.left=e.clientX+"px";
      s.style.top=e.clientY+"px";
      document.body.appendChild(s);
      const ang=Math.random()*Math.PI*2, dist=30+Math.random()*52;
      const dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist-14;
      s.animate([
        {transform:"translate(-50%,-50%) scale(.35) rotate(0deg)",opacity:1},
        {transform:`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(${.9+Math.random()*.55}) rotate(${Math.random()*220-110}deg)`,opacity:0}
      ],{duration:520+Math.random()*360,easing:"cubic-bezier(.16,.84,.44,1)"})
      .onfinish=()=>s.remove();
    }
  },{passive:true});
}

// ── 啟動 ──
(async function(){
  initBlueStringFx();
  if(DESIGN){
    ME = MOCK.me; ME_ADMIN = true;
    // 設計模式：預設直接進 App 讓硯衡調聊天/清單/個人頁；加 ?login 則停在登入頁調登入畫面
    if(new URLSearchParams(location.search).has('login')){
      showKnown(MOCK.me, '');   // 「認得你」狀態（假頭像用色塊，可調樣式）
    } else {
      $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
      await loadConversations();
    }
    return;
  }
  if(TOKEN){
    // 有記住的 token → 不直接進場，先顯示「認得你」畫面，等你按「以此帳號登入」（朋友圈式）
    try{
      const me = await api('/api/me'); ME = me.name; ME_ADMIN = String(me.scopes||'').split(',').map(s=>s.trim()).includes('admin');
      showKnown(ME, localStorage.getItem('bs-avatar') || '');
    }
    catch(e){ localStorage.removeItem('bs-token'); TOKEN=''; showInput(); }
  } else {
    showInput();
  }
})();
